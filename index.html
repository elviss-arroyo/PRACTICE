<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TMDB Movie SPA</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>TMDB Movie Explorer</h1>
    <p>Search, filter, and explore movies</p>
</header>

<main class="container">

    <!-- LEFT -->
    <div class="left-column">

        <!-- SEARCH -->
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search movies...">
            <button id="searchBtn">Search</button>
        </section>

        <!-- FILTER BUTTONS -->
        <section class="filters">
            <button class="genre-btn" data-genre="28">Action</button>
            <button class="genre-btn" data-genre="27">Horror</button>
            <button class="genre-btn" data-genre="35">Comedy</button>
        </section>

        <!-- RESULTS -->
        <section class="search-results">
            <h2>Results</h2>
            <div id="resultsGrid"></div>
            <div id="pagination"></div>
        </section>

        <!-- POPULAR -->
        <section class="categories">
            <h2>Popular Movies</h2>
            <div id="popularMovies" class="category-grid"></div>
        </section>

    </div>

    <!-- RIGHT -->
    <div class="right-column">

        <section class="movie-details">
            <h2>Details</h2>
            <div id="movieDetails">
                <p>Select a movie</p>
            </div>
        </section>

    </div>

</main>

<div id="loader" class="hidden">Loading...</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="movie.js"></script>

</body>
</html>
